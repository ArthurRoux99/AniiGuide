name: Site (tests + GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Tests dans un vrai navigateur (toutes les pages, synchro, codes…).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build:single
      # Le site en un seul fichier HTML, téléchargeable depuis l'onglet Actions.
      - uses: actions/upload-artifact@v4
        with:
          name: aniiguide-html
          path: dist-single/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Active GitHub Pages (source « GitHub Actions ») s'il ne l'est pas encore.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
