name: Site (tests + fichier à télécharger)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      # Le site en un seul fichier HTML, téléchargeable depuis l'onglet Actions.
      - uses: actions/upload-artifact@v4
        with:
          name: aniiguide-html
          path: dist-single/index.html
